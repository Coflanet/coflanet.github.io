<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커플래닛 - 홈카페 커피 일기</title>
  <meta name="description" content="취향 설문으로 원두를 찾고, 레시피와 타이머로 내리고, 한 잔을 기록하는 홈카페 앱.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="커플래닛">
  <meta property="og:description" content="홈카페 커피 일기">
  <meta property="og:url" content="https://coflanet.github.io/coflanet/app/">
  <meta property="og:image" content="https://coflanet.github.io/coflanet/app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --ink: #2f2a26; --sub: #6d665f; --line: #e7e2db; --point: #6541f2; --bg: #fbf9f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 48px; }
    .hero { display: block; width: 100%; height: auto; }
    h1 { font-size: 30px; line-height: 1.3; margin: 32px 0 8px; }
    .lead { color: var(--sub); margin: 0 0 24px; }
    .cta { display: block; text-align: center; background: var(--point); color: #fff; text-decoration: none;
      font-weight: 700; padding: 15px 20px; border-radius: 999px; }
    ul { list-style: none; margin: 32px 0; padding: 0; }
    li { padding: 14px 0; border-top: 1px solid var(--line); }
    li b { display: block; }
    li span { color: var(--sub); font-size: 15px; }
    footer { color: var(--sub); font-size: 14px; border-top: 1px solid var(--line); padding-top: 20px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <img class="hero" src="og.png" alt="선반 위 커피 도구" width="1200" height="630">
  <main class="wrap">
    <h1>커플래닛</h1>
    <p class="lead">고르고, 내리고, 기록하는 홈카페 커피 일기.</p>
    <a class="cta" href="https://apps.apple.com/kr/app/id6759236208">App Store에서 받기</a>
    <ul>
      <li><b>취향 설문</b><span>맛과 향 취향에 맞는 원두를 추천해요.</span></li>
      <li><b>레시피와 타이머</b><span>원두에 맞는 레시피를 단계별로 안내해요.</span></li>
      <li><b>봉투 사진 판독</b><span>원두 봉투를 찍으면 정보를 읽고 레시피를 제안해요.</span></li>
      <li><b>AI 바리스타</b><span>맛이 아쉬울 때 원인과 조정 방법을 알려 줘요.</span></li>
    </ul>
    <footer>
      <p>문의: team.trstudio@gmail.com</p>
      <p><a href="../">약관 및 정책</a> · © 2026 TR Studio</p>
    </footer>
  </main>
</body>
</html>
